name: bunker81-card140

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medusa_card140
      POSTGRES_USER: medusa_card140
      POSTGRES_PASSWORD: medusa_card140
    ports:
      - "127.0.0.1:${CARD140_POSTGRES_PORT:-5540}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa_card140 -d medusa_card140"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - card140-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${CARD140_REDIS_PORT:-6440}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data

volumes:
  card140-postgres:
